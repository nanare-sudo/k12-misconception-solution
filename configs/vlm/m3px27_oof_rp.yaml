    rows:
      folds:
      - 2
    sft_from: derived/sft_m3px27/m3px27_train_notes.jsonl
    probes:
    - proto_rank
    image:
      max_side: 1024
      question_max_side: 448
    batch: 6
    beams: 74
    finish_tokens: 320
    prefix_cache_tol: 0.12
    prefix_cache_same_top: false
    prefix_cache_check_rows: 4
    save_every: 25
    drop_model: true
  - name: m3px27_merge_f0
    kind: merge
    model: q38_27b
    adapter_from: ../m3_f034_rp/m3_train_f0
    out_model: m3px27_f0_merged
  - name: m3px27_rank_f0
    kind: bench
    model: m3px27_f0
    rows:
      folds:
      - 0
    sft_from: derived/sft_m3px27/m3px27_train_notes.jsonl
    probes:
    - proto_rank
    image:
      max_side: 1024
      question_max_side: 448
    batch: 6
    beams: 74
    finish_tokens: 320
    prefix_cache_tol: 0.12
    prefix_cache_same_top: false
    prefix_cache_check_rows: 4
    save_every: 25
    drop_model: true
  - name: m3px27_merge_f3
    kind: merge
    model: q38_27b
    adapter_from: ../m3_f034_rp/m3_train_f3
    out_model: m3px27_f3_merged
  - name: m3px27_rank_f3
    kind: bench
