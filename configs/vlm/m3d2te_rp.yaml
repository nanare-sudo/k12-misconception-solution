# M3, draw d2 on all 3,498 test rows: the adapter of the full fit (m3_fullte_rp/m3_train_full), merged again, texts
# generated again (greedy, limit 5,200 tokens, as for the second out-of-fold draw), exact ranking of all 74 codes. The M3
# test channel is the mean of the probabilities of its draws. Test outputs stay under artifacts/runs/; only aggregates
# are inspected.
# Inputs: the adapter m3_fullte_rp/m3_train_full under the same output root (adapter_from: ../m3_fullte_rp/m3_train_full).
# Hardware: one RTX PRO 6000 (96 GB, 200 GB disk). Time: loading + merging about 15 min; generation 3,498 x about 3.0 s,
# about 2.9 h; ranking about 3.3 s per row, about 3.2 h: about 6.4 h, about 16 USD.
run: m3d2te_rp
models:
  q38_27b:
    repo: Qwen/Qwen3.8-27B
    revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
    dtype: bf16
    max_beam_tokens: 600000
  m3d2:
    merged: m3d2_merged
    dtype: bf16
    max_beam_tokens: 600000
workers:
- gpu: 0
  jobs:
  - name: m3d2_merge
    kind: merge
    model: q38_27b
    adapter_from: ../m3_fullte_rp/m3_train_full
    out_model: m3d2_merged
  - name: m3d2_test_gen
    kind: sft_gen
    model: m3d2
    split: test
    order_seed: 0
    image:
      max_side: 1024
      question_max_side: 448
    max_tokens: 5200
    concurrency: 64
    guard_rows: 24
    guard_min_complete: 0.25
    max_failed: 0.05
    request_timeout_s: 1200
    tag: gen
    server:
      max_model_len: 16000
      gpu_memory_utilization: 0.9
      max_num_seqs: 64
      startup_s: 900
      pip: vllm==0.31.0 transformers==5.17.0
  - name: m3d2_test_rank
    kind: predict
    model: m3d2
    fold: null
    sft_from: m3d2_test_gen/gen
    probes:
    - proto_rank
    predict:
    - split: test
      tag: test
      probes:
      - proto_rank
    image:
      max_side: 1024
      question_max_side: 448
    batch: 6
    beams: 74
    finish_tokens: 320
    prefix_cache_tol: 0.12
    prefix_cache_same_top: false
    prefix_cache_check_rows: 4
    save_every: 25
    drop_model: true
