    batch: 6
    beams: 74
    finish_tokens: 320
    prefix_cache_tol: 0.12
    prefix_cache_same_top: false
    prefix_cache_check_rows: 4
    save_every: 25
    drop_model: true
  - name: q397m3_merge_f0
    kind: merge
    model: q38_27b
    adapter_from: ../m3_f034_rp/m3_train_f0
    out_model: q397m3_f0_merged
  - name: q397m3_rank_f0
    kind: bench
