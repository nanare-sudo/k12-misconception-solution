    batch: 6
    beams: 74
    finish_tokens: 320
    prefix_cache_tol: 0.12
    prefix_cache_same_top: false
    prefix_cache_check_rows: 4
    save_every: 25
    drop_model: true
  - name: q397m3_merge_f3
    kind: merge
