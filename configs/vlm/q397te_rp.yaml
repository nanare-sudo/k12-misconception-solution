# TEST side of the 397B channel (all 3,498 test rows), only after the passed fidelity check q397p_rp, on the same 4x H200
# machine (the weights are already under /workspace/models). Offline on the rented machine (local vLLM server, no outbound
# call); no API processes test rows. Answer files stay under artifacts/runs/ and are never inspected, only aggregates
# (proto_meta.json). Shuffled processing order; an interrupted run resumes. These notes are the input of the channel q397m3
# (tools/make_q397m3_notes.py --test-from runs/q397te_rp/proto_te/proto).
# Server settings as in q397p_rp: --disable-custom-all-reduce, flashinfer all-reduce off with bin_on_path, DeepGEMM off.
run: q397te_rp
models:
  q397: {repo: Qwen/Qwen3.5-397B-A17B-FP8, revision: ea5b4f81096f3901c91dea97f81324302495781d, download_workers: 32}
workers:
- gpu: "0,1,2,3"
  jobs:
  - {name: proto_te, kind: proto_gen, model: q397, split: test, order_seed: 0, tag: proto,
     image: {max_side: 1024, question_max_side: 448}, max_tokens: 2500, finish_tokens: 1500, note_chars: 16000,
     concurrency: 64, guard_rows: 24, guard_min_valid: 0.5, request_timeout_s: 1200,
     server: {dtype: auto, max_model_len: 16000, gpu_memory_utilization: 0.92, max_num_seqs: 64, startup_s: 3600, env: {VLLM_USE_DEEP_GEMM: "0", VLLM_MOE_USE_DEEP_GEMM: "0", VLLM_ALLREDUCE_USE_FLASHINFER: "0"}, bin_on_path: true, pip: "vllm==0.31.0 transformers==5.17.0",
              extra_args: ["--tensor-parallel-size", "4", "--disable-custom-all-reduce"]}}
