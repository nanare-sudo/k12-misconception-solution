# Reasoning channel, draw g, continued: test rows and folds 0, 3, 4, only the rows with P(NONE) < 0.5 in the channel
# without reasoning (positions in data/derived/think_rows/*.npy). Reasoning effort xhigh, limit 1,800 tokens.
# The levels medium and low hardly shorten the reasoning (on average 1,532 and 1,515 instead of a good 1,700 tokens at a
# limit of 1,800) and are not better, so xhigh is kept.
# The first part (zs27v_all_rp: pre-run on test rows, fold 1 with xhigh and 1,800 tokens) was stopped after fold 1 to
# measure the effort levels. Generation with the local vLLM server (only 127.0.0.1), scoring of the codes behind the text
# on the in-house path; prompt as for the channel zs27q. For test rows only aggregates in the log; the texts stay unread
# under artifacts/runs/.
run: zs27v_te_rp
models:
  q38_27b: {repo: Qwen/Qwen3.8-27B, revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0, dtype: bf16, max_beam_tokens: 600000}
workers:
- gpu: 0
  jobs:
  - {name: gen_te, kind: think_gen, model: q38_27b, split: test, fold: null, rows: {only: derived/think_rows/test.npy}, tag: think,
     taxonomy: full, topic_codes: 10, topic_none: true, teacher_labels: [pool_a, pool_b], question_codes: 8,
     image: {max_side: 1024, question_max_side: 448}, examples: true, max_examples: 4,
     max_think_tokens: 1800, concurrency: 64, server: {max_model_len: 16000, gpu_memory_utilization: 0.93, max_num_seqs: 64, startup_s: 900}}
  - {name: think_te, kind: predict, fold: null, model: q38_27b, taxonomy: full, topic_codes: 10, topic_none: true, teacher_labels: [pool_a, pool_b], question_codes: 8,
     image: {max_side: 1024, question_max_side: 448}, examples: true, max_examples: 4,
     think_from: gen_te/think, batch: 6, beams: 74, prefix_cache_tol: 0.12, prefix_cache_check_rows: 4, save_every: 25,
     predict: [{split: test, tag: test, probes: [think], rows: {only: derived/think_rows/test.npy}}]}
  - {name: gen_tr, kind: think_gen, model: q38_27b, split: train, rows: {folds: [0, 3, 4], only: derived/think_rows/train.npy}, tag: think,
     taxonomy: full, topic_codes: 10, topic_none: true, teacher_labels: [pool_a, pool_b], question_codes: 8,
     image: {max_side: 1024, question_max_side: 448}, examples: true, max_examples: 4,
     max_think_tokens: 1800, concurrency: 64, server: {max_model_len: 16000, gpu_memory_utilization: 0.93, max_num_seqs: 64, startup_s: 900}}
  - {name: think_tr, kind: bench, model: q38_27b, taxonomy: full, topic_codes: 10, topic_none: true, teacher_labels: [pool_a, pool_b], question_codes: 8,
     image: {max_side: 1024, question_max_side: 448}, examples: true, max_examples: 4,
     rows: {folds: [0, 3, 4], only: derived/think_rows/train.npy},
     probes: [think], think_from: gen_tr/think, batch: 6, beams: 74, prefix_cache_tol: 0.12, prefix_cache_check_rows: 4, save_every: 25}
