# Protocol channel, SECOND DRAW of the answers on the other 640 training rows (data/derived/proto_rows/train_rest.npy): the same
# settings as pr27s2_rp / proto_a2 (greedy, processing order order_seed 2). With pr27s2_rp the second draw n2 then exists for all
# 1,500 training rows (data/derived/proto_notes/train_pr27d2.jsonl).
# Training rows only. About 3.3 s per row: about 36 minutes; on a warm machine (weights present), with the set-up of the server
# environment, about 45 minutes and 1.90 USD.
run: pr27s3_rp
models:
  q38_27b: {repo: Qwen/Qwen3.8-27B, revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0, dtype: bf16, max_beam_tokens: 600000}
workers:
- gpu: 0
  jobs:
  - {name: proto_b2, kind: proto_gen, model: q38_27b, split: train, rows: {only: derived/proto_rows/train_rest.npy}, order_seed: 2, tag: proto,
     image: {max_side: 1024, question_max_side: 448}, max_tokens: 2500, finish_tokens: 1500, note_chars: 16000,
     concurrency: 64, guard_rows: 24, guard_min_valid: 0.5, request_timeout_s: 600,
     server: {max_model_len: 16000, gpu_memory_utilization: 0.93, max_num_seqs: 64, startup_s: 900, pip: "vllm==0.31.0 transformers==5.17.0"}}
