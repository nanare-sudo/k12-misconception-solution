# M3 draw h on the test rows of the list "character height <= 20 px" (data/derived/charsize/test_h20_rows.npy, written by
# tools/make_charsize_rows.py --max-height 20 --name h20; 2,459 of 3,498 rows), second half of the list (shard [1, 2]); the first
# half: m3hte_a_rp.yaml. Adapter of the full fit as for d1–d4 (m3_fullte_rp/m3_train_full); settings as the out-of-fold draw
# (m3ha_oof_rp/m3hb_oof_rp): image.max_side = image.min_side = 2048 in generation AND ranking, seed 5, sampled with the settings
# of the model card, 5,200 tokens, max_model_len 20,000. Test outputs stay under artifacts/runs/; only aggregates are inspected.
# Inputs: the adapter m3_fullte_rp/m3_train_full under the same output root and the row list under data/derived/charsize/.
# Hardware: one RTX PRO 6000 (96 GB, 200 GB disk); about 4 h per half (generation about 5.8 s, ranking about 4.8 s per row).
run: m3hte_b_rp
models:
  q38_27b:
    repo: Qwen/Qwen3.8-27B
    revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
    dtype: bf16
    max_beam_tokens: 600000
  m3h:
    merged: m3h_merged
    dtype: bf16
    max_beam_tokens: 600000
workers:
- gpu: 0
  jobs:
  - name: m3h_merge
    kind: merge
    model: q38_27b
    adapter_from: ../m3_fullte_rp/m3_train_full
    out_model: m3h_merged
  - name: m3h_test_gen
    kind: sft_gen
    model: m3h
    split: test
    order_seed: 0
    image:
      max_side: 2048
      min_side: 2048
      question_max_side: 448
    max_tokens: 5200
    concurrency: 64
    guard_rows: 24
    guard_min_complete: 0.25
    max_failed: 0.05
    request_timeout_s: 1200
    tag: gen
    server:
      max_model_len: 20000
      gpu_memory_utilization: 0.9
      max_num_seqs: 64
      startup_s: 900
      pip: vllm==0.31.0 transformers==5.17.0
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    seed: 5
    rows:
      only: derived/charsize/test_h20_rows.npy
      shard: &id001
      - 1
      - 2
  - name: m3h_test_rank
    kind: predict
    model: m3h
    fold: null
    sft_from: m3h_test_gen/gen
    probes:
    - proto_rank
    predict:
    - split: test
      tag: test
      probes:
      - proto_rank
      rows:
        only: derived/charsize/test_h20_rows.npy
        shard: *id001
    image:
      max_side: 2048
      min_side: 2048
      question_max_side: 448
    batch: 6
    beams: 74
    finish_tokens: 320
    prefix_cache_tol: 0.12
    prefix_cache_same_top: false
    prefix_cache_check_rows: 4
    save_every: 25
    drop_model: true
